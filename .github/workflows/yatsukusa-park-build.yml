name: Temporary Yatsukusa Park Blender Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-yatsukusa-park:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk xz-utils libegl1 libgl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1

      - name: Download Blender 4.5 LTS
        run: |
          curl --fail --location --retry 5 --retry-delay 4 \
            https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz \
            --output /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version

      - name: Materialize and patch procedural build script
        run: |
          cat .tmp-yatsukusa/part*.txt | base64 --decode | gzip --decompress > /tmp/yatsukusa_build.py
          test "$(sha256sum /tmp/yatsukusa_build.py | cut -d' ' -f1)" = "d8275e2908ff7a109aeee92553adae51f5baa72547c6121f5a143a071ae23d88"
          sed -i '/COLLECTIONS\["QUEST_WORLD"\]\.hide_viewport = True/d' /tmp/yatsukusa_build.py
          sed -i '/COLLECTIONS\["QUEST_WORLD"\]\.hide_render = True/d' /tmp/yatsukusa_build.py
          sed -i '/COLLECTIONS\["COLLIDERS"\]\.hide_viewport = True/d' /tmp/yatsukusa_build.py
          sed -i '/COLLECTIONS\["COLLIDERS"\]\.hide_render = True/d' /tmp/yatsukusa_build.py
          sed -i '/COLLECTIONS\["GUIDES"\]\.hide_viewport = True/d' /tmp/yatsukusa_build.py
          sed -i '/COLLECTIONS\["GUIDES"\]\.hide_render = True/d' /tmp/yatsukusa_build.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/yatsukusa_build.py')
          source = path.read_text(encoding='utf-8')

          old = 'create_house(f"{prefix}_House_{i}", (x, y, 0), dims, MATERIALS[mname], collection, rotate=math.radians(90) if x > 90 else 0)'
          new = 'create_house(f"{prefix}_House_{i}", (x, y), dims, MATERIALS[mname], collection, rotate=math.radians(90) if x > 90 else 0)'
          assert source.count(old) == 1
          source = source.replace(old, new)

          old = '''def export_collection(collection_name: str, stem: str) -> None:\n    coll = COLLECTIONS[collection_name]\n    selected = select_collection_objects(coll)'''
          new = '''def export_collection(collection_name: str, stem: str) -> None:\n    coll = COLLECTIONS[collection_name]\n    previous_viewport = coll.hide_viewport\n    previous_render = coll.hide_render\n    coll.hide_viewport = False\n    coll.hide_render = False\n    bpy.context.view_layer.update()\n    selected = select_collection_objects(coll)'''
          assert source.count(old) == 1
          source = source.replace(old, new)

          old = '''        path_mode="AUTO",\n    )\n    bpy.ops.object.select_all(action="DESELECT")\n\n\ndef render_cameras()'''
          new = '''        path_mode="AUTO",\n    )\n    bpy.ops.object.select_all(action="DESELECT")\n    coll.hide_viewport = previous_viewport\n    coll.hide_render = previous_render\n    bpy.context.view_layer.update()\n\n\ndef render_cameras()'''
          assert source.count(old) == 1
          source = source.replace(old, new)

          old = '''    setup_lighting_and_cameras()\n    set_collection_visibility(True, False)'''
          new = '''    setup_lighting_and_cameras()\n    COLLECTIONS["COLLIDERS"].hide_viewport = True\n    COLLECTIONS["COLLIDERS"].hide_render = True\n    COLLECTIONS["GUIDES"].hide_viewport = True\n    COLLECTIONS["GUIDES"].hide_render = True\n    set_collection_visibility(True, False)'''
          assert source.count(old) == 1
          source = source.replace(old, new)

          path.write_text(source, encoding='utf-8')
          PY
          python3 -m py_compile /tmp/yatsukusa_build.py

      - name: Build Blender project, exports, and comparison views
        env:
          YATSUKUSA_OUT: ${{ github.workspace }}/yatsukusa-output
        run: |
          set -o pipefail
          mkdir -p "$YATSUKUSA_OUT"
          /tmp/blender/blender --background --factory-startup --python /tmp/yatsukusa_build.py 2>&1 | tee "$YATSUKUSA_OUT/blender-build.log"
          cp /tmp/yatsukusa_build.py "$YATSUKUSA_OUT/build_yatsukusa_park.py"
          test -s "$YATSUKUSA_OUT/Yatsukusa_Park_VRChat.blend"
          test -s "$YATSUKUSA_OUT/Yatsukusa_Park_PC.glb"
          test -s "$YATSUKUSA_OUT/renders/01_front_entrance.png"
          find "$YATSUKUSA_OUT" -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Upload Blender deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yatsukusa-park-vrchat-blender
          path: yatsukusa-output/**
          if-no-files-found: error
          retention-days: 3
