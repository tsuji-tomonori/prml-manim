name: Review display sections 3.4 and 5.1

on:
  pull_request:
    paths:
      - 'feature/3.*/3.4.*/**'
      - 'feature/5.*/5.1.*/**'
      - 'scripts/review_display_sections.py'
      - '.github/workflows/display-sections.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        section: ['3.4', '5.1']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev ffmpeg dvisvgm texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk
      - run: uv sync --frozen
      - name: Verify numerics, captions, full preview and PCM synchronization
        run: uv run python scripts/review_display_sections.py --section '${{ matrix.section }}' --quality low
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-review-${{ matrix.section }}
          path: review-output/${{ matrix.section }}/
          if-no-files-found: error
          retention-days: 14
